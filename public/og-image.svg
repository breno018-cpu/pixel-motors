<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Orbs for Low-Poly & Glass Effect -->
    <radialGradient id="primaryGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="80%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Fill with Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 900; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Mesh & Glowing Orbs -->
  <circle cx="240" cy="180" r="450" fill="url(#primaryGlow)" />
  <circle cx="960" cy="460" r="480" fill="url(#blueGlow)" />

  <!-- Grid Tech Pattern Subtle -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- ======================================================== -->
  <!-- LEFT HERO SECTION                                        -->
  <!-- ======================================================== -->

  <!-- Top Badge / Pill (Expo Glass Effect) -->
  <g transform="translate(80, 72)">
    <rect width="270" height="38" rx="19" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="34" y="24" class="text" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="1.5">
      SISTEMA CONCESSIONÁRIO 9.0
    </text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(80, 150)">
    <text x="0" y="55" class="title" fill="#ffffff" font-size="64" letter-spacing="-1.5">
      PIXEL <tspan fill="#e11d48">MOTORS</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="250" class="text" fill="#94a3b8" font-size="22" font-weight="500" letter-spacing="-0.2">
    Inteligência Comercial, Gestão de Estoque Multi-Lojas,
  </text>
  <text x="80" y="282" class="text" fill="#94a3b8" font-size="22" font-weight="500" letter-spacing="-0.2">
    F&amp;I Bancário, Contratos e Roteirizador de Entregas.
  </text>

  <!-- Feature Tags (Glass Pills) -->
  <g transform="translate(80, 335)">
    <!-- Tag 1: Montes Claros -->
    <rect x="0" y="0" width="168" height="34" rx="10" fill="rgba(225, 29, 72, 0.12)" stroke="rgba(225, 29, 72, 0.35)" stroke-width="1" />
    <text x="14" y="22" class="text" fill="#fda4af" font-size="12" font-weight="700">
      &#9670; Polo Montes Claros
    </text>

    <!-- Tag 2: Divinópolis -->
    <rect x="180" y="0" width="160" height="34" rx="10" fill="rgba(37, 99, 235, 0.12)" stroke="rgba(37, 99, 235, 0.35)" stroke-width="1" />
    <text x="194" y="22" class="text" fill="#93c5fd" font-size="12" font-weight="700">
      &#9670; Polo Divinópolis
    </text>

    <!-- Tag 3: Rotas & Frete -->
    <rect x="352" y="0" width="145" height="34" rx="10" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1" />
    <text x="366" y="22" class="text" fill="#e2e8f0" font-size="12" font-weight="600">
      &#9656; Rotas de Entrega
    </text>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(80, 520)">
    <text x="0" y="20" class="mono" fill="#64748b" font-size="13" font-weight="600" letter-spacing="1">
      DEALFLOW HUB &bull; CONTRATOS DIGITAIS &bull; COMISSÕES &amp; FOLHA CLT
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT SIDE: EXPO GLASS PREVIEW CARDS (LAYERED 3D)        -->
  <!-- ======================================================== -->

  <!-- Card 1: Logistics & Delivery Route (Underneath) -->
  <g transform="translate(680, 80)" filter="url(#cardShadow)">
    <rect width="440" height="230" rx="24" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2" />
    
    <!-- Header of Card -->
    <circle cx="36" cy="36" r="14" fill="#e11d48" opacity="0.18" />
    <polygon points="36,28 43,36 36,44 29,36" fill="#e11d48" />
    <text x="62" y="36" class="title" fill="#ffffff" font-size="15">Rota &bull; BR-135 / MG-050</text>
    <text x="62" y="49" class="text" fill="#64748b" font-size="11">Roteirizador de Veículos Faturados</text>

    <!-- Route preview line curved -->
    <path d="M 40 130 Q 150 70, 240 120 T 400 95" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
    <path d="M 40 130 Q 150 70, 240 120 T 400 95" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.9" />

    <!-- Route Nodes -->
    <circle cx="40" cy="130" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="40" y="152" class="text" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">MOC</text>

    <circle cx="240" cy="120" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
    <text x="240" y="142" class="text" fill="#93c5fd" font-size="9" text-anchor="middle">Janaúba</text>

    <circle cx="400" cy="95" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
    <text x="400" y="117" class="text" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">DIV</text>

    <!-- Stats row inside card -->
    <g transform="translate(24, 172)">
      <rect width="120" height="38" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="60" y="18" class="text" fill="#64748b" font-size="9" text-anchor="middle">ALCANCE MÁX</text>
      <text x="60" y="32" class="mono" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">380 km</text>

      <rect x="135" width="120" height="38" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="195" y="18" class="text" fill="#64748b" font-size="9" text-anchor="middle">TEMPO MÉDIO</text>
      <text x="195" y="32" class="mono" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">2h 45m</text>

      <rect x="270" width="120" height="38" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="330" y="18" class="text" fill="#64748b" font-size="9" text-anchor="middle">MUNICIPIOS</text>
      <text x="330" y="32" class="mono" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">24 Cidades</text>
    </g>
  </g>

  <!-- Card 2: Executive KPI Floating Overlay (Expo Glass Front) -->
  <g transform="translate(630, 335)" filter="url(#cardShadow)">
    <rect width="490" height="235" rx="26" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.4" />
    
    <!-- Top Row of Front Card -->
    <g transform="translate(32, 28)">
      <rect width="36" height="36" rx="10" fill="#e11d48" />
      <path d="M 12 10 L 24 10 L 24 18 L 18 18 L 18 26 L 12 26 Z" fill="#ffffff" transform="translate(2, 0)" />
      
      <text x="48" y="16" class="title" fill="#ffffff" font-size="16">Faturamento &amp; Volume do Mês</text>
      <text x="48" y="31" class="text" fill="#10b981" font-size="12" font-weight="700">&#9650; +18.4% Meta Atingida</text>
    </g>

    <!-- Big KPI Numbers -->
    <g transform="translate(32, 85)">
      <text x="0" y="44" class="mono" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-1">
        R$ 294.500<tspan fill="#64748b" font-size="20">,00</tspan>
      </text>
      <text x="0" y="68" class="text" fill="#94a3b8" font-size="12">
        23 motos faturadas e liberadas no período atual
      </text>
    </g>

    <!-- Mini Progress Bar / Indicators -->
    <g transform="translate(32, 178)">
      <!-- Progress Bar Track -->
      <rect width="426" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
      <rect width="340" height="8" rx="4" fill="url(#pillGrad)" />

      <!-- Sub indicators -->
      <text x="0" y="26" class="text" fill="#cbd5e1" font-size="11" font-weight="600">
        Polo Norte &amp; Centro-Oeste
      </text>
      <text x="426" y="26" class="mono" fill="#e11d48" font-size="12" font-weight="800" text-anchor="end">
        98% META
      </text>
    </g>
  </g>

</svg>
